# SPDX-License-Identifier: MIT OR Apache-2.0
#
# LamdaFunction CI and release.
#
# Every push and pull request: Rust checks (fmt, clippy, tests, docs, teaching
# comments), the Python suites, one abi3 wheel per platform, and the Blender
# test suite headless on Linux and Windows with the wheel of that platform
# (spike 3 on the platforms this Mac cannot run).
#
# A tag `v*`: the same, then the four extension zips are built with Blender on
# Linux and attached to a GitHub release together with the tutorial PDF.
#
# Release procedure, from the repository root:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag must match `version` in addon/blender_manifest.toml.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  BLENDER_VERSION: "5.2.2"
  BLENDER_SERIES: "5.2"

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_teaching.py

  wheels:
    name: Wheel ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   os: ubuntu-latest,  target: x86_64,  manylinux: "2_28" }
          - { name: windows-x64, os: windows-latest, target: x64 }
          - { name: macos-arm64, os: macos-14,       target: aarch64 }
          - { name: macos-x64,   os: macos-13,       target: x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out wheelhouse -m core/lamda-py/Cargo.toml
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  python:
    name: Python suites (bindings, reference, compiler, differential)
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x64
          path: wheelhouse
      - run: python -m pip install numpy pytest wheelhouse/*.whl
      - run: python -m pytest addon/model addon/compile reference tests/python -q

  blender:
    name: Blender tests ${{ matrix.name }}
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   os: ubuntu-latest,  wheel: wheel-linux-x64 }
          - { name: windows-x64, os: windows-latest, wheel: wheel-windows-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.wheel }}
          path: addon/wheels
      - name: Install Blender (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libice6
          curl -sSL -o blender.tar.xz "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          mkdir -p "$HOME/blender" && tar -xJf blender.tar.xz -C "$HOME/blender" --strip-components=1
          echo "BLENDER=$HOME/blender/blender" >> "$GITHUB_ENV"
      - name: Install Blender (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -sSL -o blender.zip "https://download.blender.org/release/Blender$env:BLENDER_SERIES/blender-$env:BLENDER_VERSION-windows-x64.zip"
          Expand-Archive blender.zip -DestinationPath "$env:USERPROFILE\blender"
          $exe = Get-ChildItem "$env:USERPROFILE\blender" -Recurse -Filter blender.exe | Select-Object -First 1
          "BLENDER=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Blender test suite with the wheel
        shell: bash
        run: '"$BLENDER" -b --factory-startup --python-exit-code 1 --python tests/blender/run_all.py'
      - name: Pipes test with the Python fallback
        shell: bash
        run: 'LAMDA_NO_WHEEL=1 "$BLENDER" -b --factory-startup --python-exit-code 1 --python tests/blender/test_pipes.py'

  release:
    name: Extension zips and release
    needs: [rust, python, blender]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: addon/wheels
          merge-multiple: true
      - name: Install Blender
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libice6
          curl -sSL -o blender.tar.xz "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          mkdir -p "$HOME/blender" && tar -xJf blender.tar.xz -C "$HOME/blender" --strip-components=1
          echo "BLENDER=$HOME/blender/blender" >> "$GITHUB_ENV"
      - name: Check the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' addon/blender_manifest.toml)
          tag="${GITHUB_REF_NAME#v}"
          test "$manifest" = "$tag" || { echo "manifest version $manifest != tag $tag"; exit 1; }
      - name: Build the four zips
        run: |
          ls addon/wheels
          python scripts/build_extension.py
          ls -la dist
      - name: Tutorial PDF
        run: python scripts/md2pdf.py docs/pipes-tutorial.md dist/pipes-tutorial.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: dist/*
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/pipes-tutorial.pdf
            examples/pipes.blend
          generate_release_notes: true
          body: |
            LamdaFunction ${{ github.ref_name }} for Blender 5.2 LTS or newer.

            Download the zip for your platform and install it with Edit → Preferences → Get Extensions → Install from Disk. Every zip contains the native solver for its platform and the Python fallback. The tutorial PDF and the pipes example file are attached; the tutorial's first section is the install procedure.
